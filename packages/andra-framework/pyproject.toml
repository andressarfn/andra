[tool.poetry]
name = "andra-framework"
version = "0.1.0"
description = "Opinionated framework layer for the Andra ecosystem — built on top of andra-core"
authors = ["Andra <hello@andra.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/andra-ai/andra"
repository = "https://github.com/andra-ai/andra"
keywords = ["llm", "chatbot", "framework", "andra", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "andra_framework", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
andra-core = { path = "../andra-core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
mypy = "^1.10"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

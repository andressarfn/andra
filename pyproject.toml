[tool.poetry]
name = "andra-core"
version = "0.1.0"
description = "Core library for the Andra ecosystem — LLM-powered corporate chatbots"
authors = ["Andra <hello@andra.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/andra-ai/andra-core"
repository = "https://github.com/andra-ai/andra-core"
keywords = ["llm", "chatbot", "core", "andra", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "andra_core", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
mypy = "^1.10"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["examples/"]

[tool.ruff]
line-length = 100
target-version = "py312"
